<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="robots" content="noindex">
  <title>Lista compartida</title>
  <style>
    :root { --fondo: #F4F1EA; --tarjeta: #FFFFFF; --texto: #1B1B1B; --suave: #6B6B6B; --borde: #E2DDD3; --verde: #2E8B57; --acento: #C8862B; --rojo: #C0392B; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #121417; --tarjeta: #1C1F24; --texto: #ECEEF0; --suave: #9AA1AB; --borde: #2A2E35; --verde: #3DD68C; --acento: #F5B82E; --rojo: #FF7B7B; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, button, input, label { touch-action: manipulation; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); padding: 16px 16px calc(90px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 800; } .suave { color: var(--suave); } .chico { font-size: 13px; }
    .sec { font-size: 12px; font-weight: 800; letter-spacing: .5px; color: var(--suave); margin: 16px 4px 6px; text-transform: uppercase; }
    .caja { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; overflow: hidden; }
    .it { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--borde); }
    .it:last-child { border-bottom: 0; }
    .it input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--verde); flex-shrink: 0; }
    .foto { width: 44px; height: 44px; border-radius: 11px; overflow: hidden; background: var(--fondo); border: 0; padding: 0; flex-shrink: 0; }
    .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .nom { flex: 1; min-width: 0; background: none; border: 0; text-align: left; color: var(--texto); font: inherit; display: flex; flex-direction: column; }
    .nom b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .on .nom b, .on .q { text-decoration: line-through; opacity: .5; }
    .q { font-weight: 800; white-space: nowrap; }
    .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 13px; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 8px; background: var(--verde); color: #fff; }
    .btn.sec { background: transparent; border: 1.5px solid var(--borde); color: var(--texto); }
    .btn.ac { background: transparent; border: 1.5px solid var(--acento); color: var(--acento); }
    .barra { height: 9px; border-radius: 5px; background: var(--borde); overflow: hidden; margin-top: 8px; } .barra i { display: block; height: 100%; background: var(--verde); }
    .velo { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
    .velo.ver { display: flex; }
    .panel { background: var(--fondo); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .grande { width: 100%; aspect-ratio: 1/1; object-fit: contain; border-radius: 14px; background: var(--tarjeta); margin-top: 10px; display: flex; align-items: center; justify-content: center; color: var(--suave); }
    input.txt { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); padding: 0 12px; font: inherit; font-size: 16px; margin-top: 6px; }
    .consulta { border: 1.5px solid var(--acento); border-radius: 16px; padding: 12px; margin: 10px 0; background: var(--tarjeta); }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .vivo { font-size: 12.5px; color: var(--verde); font-weight: 700; margin-top: 4px; min-height: 16px; }
    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #000d; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
    .toast.ver { opacity: 1; }
    .agregar { display: flex; gap: 8px; margin-top: 12px; } .agregar input { flex: 1; margin: 0; } .agregar .btn { width: auto; margin: 0; padding: 0 16px; }
  </style>
</head>
<body>
  <div id="app"><div class="suave" style="text-align:center;margin-top:40vh">Abriendo la lista…</div></div>
  <div class="velo" id="velo" onclick="if (event.target === this) L.cerrar()"><div class="panel" id="panel"></div></div>
  <div class="toast" id="toast"></div>
  <script src="js/lista.js"></script>
</body>
</html>
